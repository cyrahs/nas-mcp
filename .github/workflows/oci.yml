name: oci

on:
  push:
    branches: [main]
    paths: ['oci/**', '.github/workflows/oci.yml', '.github/workflows/build.yml']
  pull_request:
    paths: ['oci/**', '.github/workflows/oci.yml', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      bridge: oci
