# Builds one bridge's image. Called by the per-bridge workflows, which only
# run when that bridge's directory changes: an unchanged bridge keeps its
# digest, so Flux does not restart its pod.
name: build

on:
  workflow_call:
    inputs:
      bridge:
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.bridge }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.bridge }}
            ghcr.io/${{ github.repository }}:${{ inputs.bridge }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.bridge }}
          cache-to: type=gha,mode=max,scope=${{ inputs.bridge }}
