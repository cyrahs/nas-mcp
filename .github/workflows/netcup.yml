name: netcup

on:
  push:
    branches: [main]
    paths: ['netcup/**', '.github/workflows/netcup.yml', '.github/workflows/build.yml']
  pull_request:
    paths: ['netcup/**', '.github/workflows/netcup.yml', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      bridge: netcup
